<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Damask Wallpaper Pattern -->
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4e3" />
      <stop offset="50%" stop-color="#f7e8ce" />
      <stop offset="100%" stop-color="#ebd2b0" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1c18" />
      <stop offset="60%" stop-color="#1a0f0d" />
      <stop offset="100%" stop-color="#0a0504" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3be94" />
      <stop offset="60%" stop-color="#e5a87a" />
      <stop offset="100%" stop-color="#d39263" />
    </linearGradient>

    <!-- Yellow Top Gradient -->
    <linearGradient id="yellowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#ffa000" />
    </linearGradient>

    <!-- Denim Jeans Gradient -->
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c93c4" />
      <stop offset="50%" stop-color="#3b72a6" />
      <stop offset="100%" stop-color="#224f7c" />
    </linearGradient>

    <!-- Gold Hoop Metallic -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>

    <!-- Damask Leaf Pattern Unit -->
    <pattern id="damaskPattern" width="120" height="160" patternUnits="userSpaceOnUse">
      <path d="M60 10 C40 30, 20 60, 60 100 C100 60, 80 30, 60 10 Z" fill="#4a7c9d" opacity="0.25" />
      <path d="M60 25 C45 40, 35 60, 60 85 C85 60, 75 40, 60 25 Z" fill="#d49b4b" opacity="0.3" />
      <path d="M10 90 C-10 110, -10 140, 30 150 C50 130, 30 100, 10 90 Z" fill="#4a7c9d" opacity="0.2" />
      <path d="M110 90 C130 110, 130 140, 90 150 C70 130, 90 100, 110 90 Z" fill="#d49b4b" opacity="0.2" />
    </pattern>

    <!-- Daisy Flower Pattern for Top -->
    <pattern id="daisyPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#fff8e1" />
      <ellipse cx="12" cy="7" rx="1.5" ry="3" fill="#ffffff" opacity="0.9" />
      <ellipse cx="12" cy="17" rx="1.5" ry="3" fill="#ffffff" opacity="0.9" />
      <ellipse cx="7" cy="12" rx="3" ry="1.5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="17" cy="12" rx="3" ry="1.5" fill="#ffffff" opacity="0.9" />
      <ellipse cx="8.5" cy="8.5" rx="2" ry="1.2" transform="rotate(45 8.5 8.5)" fill="#ffffff" opacity="0.85" />
      <ellipse cx="15.5" cy="15.5" rx="2" ry="1.2" transform="rotate(45 15.5 15.5)" fill="#ffffff" opacity="0.85" />
      <ellipse cx="15.5" cy="8.5" rx="2" ry="1.2" transform="rotate(-45 15.5 8.5)" fill="#ffffff" opacity="0.85" />
      <ellipse cx="8.5" cy="15.5" rx="2" ry="1.2" transform="rotate(-45 8.5 15.5)" fill="#ffffff" opacity="0.85" />
    </pattern>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="800" fill="url(#bgWall)" />
  <rect width="600" height="800" fill="url(#damaskPattern)" />

  <!-- Soft Character Shadow on Wall -->
  <ellipse cx="300" cy="460" rx="180" ry="280" fill="#2d1c18" opacity="0.15" filter="blur(20px)" />

  <!-- Back Hair (Volume behind shoulders) -->
  <path d="M 180 200 C 120 280, 110 400, 160 480 C 200 450, 220 380, 230 310 Z" fill="url(#hairGrad)" />
  <path d="M 420 200 C 480 280, 490 400, 440 480 C 400 450, 380 380, 370 310 Z" fill="url(#hairGrad)" />

  <!-- Denim Jeans -->
  <path d="M 210 550 L 150 800 L 290 800 L 300 620 L 310 800 L 450 800 L 390 550 Z" fill="url(#denimGrad)" />
  <!-- Jeans Seams & Creases -->
  <path d="M 300 560 L 300 800" stroke="#1d3b5e" stroke-width="3" />
  <path d="M 210 560 C 230 650, 200 740, 180 800" stroke="#4878a4" stroke-width="2" opacity="0.6" />
  <path d="M 390 560 C 370 650, 400 740, 420 800" stroke="#4878a4" stroke-width="2" opacity="0.6" />

  <!-- Yellow Peplum Top Base -->
  <!-- Peplum Flare Skirt -->
  <path d="M 200 370 C 160 450, 110 540, 140 590 C 240 640, 360 640, 460 590 C 490 540, 440 450, 400 370 Z" fill="url(#yellowTop)" />
  <path d="M 200 370 C 160 450, 110 540, 140 590 C 240 640, 360 640, 460 590 C 490 540, 440 450, 400 370 Z" fill="url(#daisyPattern)" opacity="0.85" />

  <!-- Top Bodice & V-Neck -->
  <path d="M 220 280 Q 300 300 380 280 L 410 380 Q 300 410 190 380 Z" fill="url(#yellowTop)" />
  <path d="M 220 280 Q 300 300 380 280 L 410 380 Q 300 410 190 380 Z" fill="url(#daisyPattern)" opacity="0.85" />

  <!-- V-Neckline Cutout (Chest & Neck) -->
  <path d="M 265 270 Q 300 350 335 270 Z" fill="url(#skinGrad)" />

  <!-- Neck & Clavicle -->
  <path d="M 265 220 L 265 275 Q 300 295 335 275 L 335 220 Z" fill="url(#skinGrad)" />
  <path d="M 275 270 Q 300 280 325 270" stroke="#c07d52" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Head & Face Base -->
  <ellipse cx="300" cy="195" rx="72" ry="82" fill="url(#skinGrad)" />

  <!-- Cheeks Rosy Blush -->
  <circle cx="250" cy="205" r="22" fill="#e57373" opacity="0.3" filter="blur(5px)" />
  <circle cx="350" cy="205" r="22" fill="#e57373" opacity="0.3" filter="blur(5px)" />

  <!-- Ears & Gold Earrings -->
  <circle cx="228" cy="200" r="14" fill="url(#skinGrad)" />
  <circle cx="372" cy="200" r="14" fill="url(#skinGrad)" />

  <!-- Gold Hoop Earrings -->
  <circle cx="225" cy="214" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="375" cy="214" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />

  <!-- Big Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="260" cy="188" rx="20" ry="24" fill="#ffffff" />
  <ellipse cx="262" cy="188" rx="14" ry="18" fill="#3e2723" />
  <ellipse cx="263" cy="188" rx="9" ry="12" fill="#1a0f0d" />
  <circle cx="267" cy="182" r="5" fill="#ffffff" />
  <circle cx="258" cy="194" r="2" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="340" cy="188" rx="20" ry="24" fill="#ffffff" />
  <ellipse cx="338" cy="188" rx="14" ry="18" fill="#3e2723" />
  <ellipse cx="337" cy="188" rx="9" ry="12" fill="#1a0f0d" />
  <circle cx="341" cy="182" r="5" fill="#ffffff" />
  <circle cx="332" cy="194" r="2" fill="#ffffff" />

  <!-- Eyelashes & Brows -->
  <!-- Left Eyebrow -->
  <path d="M 235 158 Q 260 148 285 160" stroke="#1a0f0d" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M 238 172 Q 260 162 282 172" stroke="#1a0f0d" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Right Eyebrow -->
  <path d="M 315 160 Q 340 148 365 158" stroke="#1a0f0d" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M 318 172 Q 340 162 362 172" stroke="#1a0f0d" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Cute Nose -->
  <path d="M 295 202 Q 300 210 305 202" stroke="#b86b3e" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Sweet Smile -->
  <path d="M 268 225 Q 300 248 332 225" stroke="#b71c1c" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 272 226 Q 300 242 328 226" fill="#e53935" opacity="0.6" />

  <!-- Gorgeous Voluminous Front Wavy Hair -->
  <!-- Crown & Bangs -->
  <path d="M 225 180 C 210 120, 280 80, 300 85 C 320 80, 390 120, 375 180 C 350 125, 250 125, 225 180 Z" fill="url(#hairGrad)" />
  
  <!-- Left Cascading Wavy Locks -->
  <path d="M 230 140 C 170 160, 140 240, 160 320 C 180 380, 220 420, 190 480 C 160 420, 180 340, 195 280 C 210 220, 215 180, 230 140 Z" fill="url(#hairGrad)" />
  
  <!-- Right Cascading Wavy Locks -->
  <path d="M 370 140 C 430 160, 460 240, 440 320 C 420 380, 380 420, 410 480 C 440 420, 420 340, 405 280 C 390 220, 385 180, 370 140 Z" fill="url(#hairGrad)" />

  <!-- Hair Highlights -->
  <path d="M 245 120 Q 280 100 305 105" stroke="#5d4037" stroke-width="3" fill="none" opacity="0.6" />
  <path d="M 180 260 Q 165 310 185 360" stroke="#5d4037" stroke-width="3" fill="none" opacity="0.5" />
  <path d="M 420 260 Q 435 310 415 360" stroke="#5d4037" stroke-width="3" fill="none" opacity="0.5" />
</svg>
